[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesoprint"
version = "0.1.0"
description = "Detect and extract fingerprint impressions on 3D scans of cuneiform tablets and other clay objects"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "scipy>=1.9", "plyfile>=0.8", "pillow>=9"]

[project.optional-dependencies]
test = ["pytest"]
review = ["flask>=2"]

[project.scripts]
mesoprint = "mesoprint.cli:main"

[tool.setuptools]
packages = ["mesoprint"]

[tool.setuptools.package-data]
mesoprint = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
